<!doctype html>
<html lang="en">

<title>Chemistry Lab Challenge | Reema International Schools 2</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%AA%3C/text%3E%3C/svg%3E">
<style>
:root{
  --teal:#40b0c0;--teal-d:#1f7f8f;--teal-dd:#145a67;--ink:#413e35;--mut:#6a665c;
  --paper:#f2f8f9;--card:#fff;--line:#d3e3e6;--tint:#e6f4f6;
  --ok:#17803d;--okbg:#e3f5ea;--bad:#b42a2a;--badbg:#fbe7e7;--amber:#c77d0a;
  --font:"Avenir Next","Segoe UI","Trebuchet MS",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;color:var(--ink);font-family:var(--font);line-height:1.5;
  padding-bottom:env(safe-area-inset-bottom,0px);
  background-color:var(--paper);background-image:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22440%22 height=%22440%22 viewBox=%220 0 440 440%22%3E%3Cg color=%22%2340b0c0%22 fill=%22none%22 stroke=%22%2340b0c0%22 stroke-opacity=%22.16%22 stroke-width=%221.3%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cg transform=%22translate%2840 36%29 rotate%28-14 12 12%29 scale%282.7%29%22%3E%3Cpath d=%22M9 3h6M10 3v6L4.5 19a1.6 1.6 0 0 0 1.4 2.4h12.2a1.6 1.6 0 0 0 1.4-2.4L14 9V3%22/%3E%3Cpath d=%22M7.5 15h9%22/%3E%3C/g%3E%3Cg transform=%22translate%28300 50%29 rotate%2812 12 12%29 scale%282.5%29%22%3E%3Cpath d=%22M6 3h12M7 3v16a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V3%22/%3E%3Cpath d=%22M7.6 12h8.8v3.2a1.8 1.8 0 0 1-1.8 1.8H9.4a1.8 1.8 0 0 1-1.8-1.8z%22 fill=%22currentColor%22 stroke=%22none%22 opacity=%22.35%22/%3E%3Cpath d=%22M7 12h10%22/%3E%3C/g%3E%3Cg transform=%22translate%28168 190%29 rotate%2828 12 12%29 scale%282.9%29%22%3E%3Cpath d=%22M9 3h6M10 3v14a2 2 0 0 0 4 0V3%22/%3E%3Cpath d=%22M10 11h4%22/%3E%3C/g%3E%3Cg transform=%22translate%2836 270%29 rotate%280 12 12%29 scale%282.5%29%22%3E%3Ccircle cx=%2212%22 cy=%2212%22 r=%221.6%22 fill=%22currentColor%22/%3E%3Cellipse cx=%2212%22 cy=%2212%22 rx=%229%22 ry=%223.6%22/%3E%3Cellipse cx=%2212%22 cy=%2212%22 rx=%229%22 ry=%223.6%22 transform=%22rotate%2860 12 12%29%22/%3E%3Cellipse cx=%2212%22 cy=%2212%22 rx=%229%22 ry=%223.6%22 transform=%22rotate%28120 12 12%29%22/%3E%3C/g%3E%3Cg transform=%22translate%28236 336%29 rotate%28-8 12 12%29 scale%282.2%29%22%3E%3Cpath d=%22M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z%22/%3E%3C/g%3E%3Cpath d=%22M350 300l-15 26h-30l-15-26 15-26h30z%22/%3E%3Ccircle cx=%22350%22 cy=%22300%22 r=%225%22/%3E%3Ccircle cx=%22335%22 cy=%22326%22 r=%225%22/%3E%3Ccircle cx=%22305%22 cy=%22326%22 r=%225%22/%3E%3Ccircle cx=%22290%22 cy=%22300%22 r=%225%22/%3E%3Ccircle cx=%22305%22 cy=%22274%22 r=%225%22/%3E%3Ccircle cx=%22335%22 cy=%22274%22 r=%225%22/%3E%3Cpath d=%22M350 300l30-14%22/%3E%3Ccircle cx=%22386%22 cy=%22283%22 r=%226%22/%3E%3Ccircle cx=%22150%22 cy=%2290%22 r=%227%22/%3E%3Ccircle cx=%22176%22 cy=%2264%22 r=%224%22/%3E%3Ccircle cx=%22130%22 cy=%22130%22 r=%223%22/%3E%3Ccircle cx=%22410%22 cy=%22170%22 r=%226%22/%3E%3Ccircle cx=%22388%22 cy=%22196%22 r=%223%22/%3E%3Ccircle cx=%22110%22 cy=%22400%22 r=%226%22/%3E%3Ccircle cx=%22134%22 cy=%22378%22 r=%223%22/%3E%3C/g%3E%3C/svg%3E");background-size:440px 440px}
:focus-visible{outline:3px solid var(--teal-dd);outline-offset:2px}
button{font:inherit;color:inherit}
.top{background:#fff;border-bottom:5px solid var(--teal);padding-top:env(safe-area-inset-top,0px)}
.top .in{max-width:900px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{height:54px;width:auto;display:block}
.top .tl{font-weight:700;color:var(--teal-dd);text-align:right;line-height:1.2}
.top .tl small{display:block;font-weight:400;color:var(--mut)}
.wrap{flex:1;width:100%;max-width:900px;margin:0 auto;padding:22px 18px 28px}
footer{background:var(--ink);color:#e9e7df;font-size:.85rem;text-align:center;padding:14px 18px}
h1{font-size:clamp(1.9rem,5.2vw,2.8rem);line-height:1.1;margin:0 0 8px;color:var(--ink);letter-spacing:-.01em}
h2{margin:0}
.lead{font-size:1.05rem;color:var(--mut);margin:0 0 20px;max-width:56ch}
.grid{display:grid;grid-template-columns:1.05fr 1fr;gap:20px;align-items:start}
.sheet{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--teal);border-radius:6px;padding:20px;box-shadow:0 6px 18px rgba(20,90,103,.08)}
.sheet+.sheet{margin-top:18px}
.sheet h3{margin:0 0 10px;font-size:1.05rem;color:var(--teal-dd)}
label.f{display:block;font-weight:600;font-size:.92rem;margin:0 0 4px}
.inp{width:100%;font:inherit;font-size:1rem;padding:11px 12px;border:2px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);margin-bottom:14px}
.inp:focus{border-color:var(--teal-d);outline:none;box-shadow:0 0 0 3px rgba(64,176,192,.35)}
.two-in{display:grid;grid-template-columns:1.4fr 1fr;gap:12px}
fieldset{border:0;padding:0;margin:0 0 16px}
legend{font-weight:600;font-size:.92rem;padding:0;margin-bottom:6px}
.lvopt{display:block;position:relative;margin-bottom:8px}
.lvopt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.lvopt .lo{display:flex;align-items:center;gap:12px;border:2px solid var(--line);border-radius:6px;padding:10px 12px;background:#fff}
.lvopt .lo .ic{color:var(--teal-d)}
.lvopt b{display:block}
.lvopt small{color:var(--mut)}
.lvopt input:checked+.lo{border-color:var(--teal-d);background:var(--tint)}
.lvopt input:focus-visible+.lo{outline:3px solid var(--teal-dd);outline-offset:2px}
.go{font:inherit;font-weight:700;font-size:1.05rem;color:#fff;background:var(--teal-d);border:0;border-radius:6px;padding:13px 26px;cursor:pointer;min-height:48px}
.go:hover{background:var(--teal-dd)}
.ghost{font:inherit;font-weight:600;color:var(--teal-dd);background:#fff;border:2px solid var(--teal-d);border-radius:6px;padding:8px 14px;cursor:pointer;min-height:44px}
.ghost:hover:not(:disabled){background:var(--tint)}
.ghost:disabled{opacity:.45;cursor:default}
.link{background:none;border:0;padding:6px 0;color:var(--mut);text-decoration:underline;cursor:pointer;font-size:.88rem}
.err{color:var(--bad);font-weight:600;margin:-6px 0 12px;min-height:1.2em}
.mut{color:var(--mut)}
.note{font-size:.85rem;color:var(--mut);margin:10px 0 0}
.warnbox{background:#fff4dc;border:1px solid #e8c36a;border-radius:6px;padding:8px 12px;font-size:.88rem;margin-top:12px}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th{font-weight:600;text-align:left;color:var(--mut);border-bottom:1px solid var(--line);padding:4px 6px 4px 0}
.tbl td{padding:6px 6px 6px 0;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl td:last-child,.tbl th:last-child{text-align:right;padding-right:0}
.num{font-variant-numeric:tabular-nums}
.stg{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;font-size:.9rem;margin:6px 0 14px}
.stg i{display:block;height:8px;background:var(--teal);border-radius:4px}
.stg .rg{color:var(--mut)}
.rules{margin:0;padding-left:1.1rem;font-size:.92rem}
.rules li{margin:3px 0}
/* game */
.hud{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.hud .rd b{display:block;font-size:1.05rem;color:var(--teal-dd)}
.hud .rd span{font-size:.9rem;color:var(--mut)}
.hud .rt{display:flex;align-items:center;gap:16px}
.sc{font-size:.95rem}.sc b{font-size:1.5rem;color:var(--ink)}
.prog{display:flex;gap:4px;margin:12px 0 0;align-items:flex-end}
.prog i{position:relative;display:block;flex:1;max-width:30px;height:36px;border:2px solid #9db9bd;border-top-width:3px;border-radius:2px 2px 15px 15px;background:rgba(255,255,255,.85);overflow:hidden}
.prog i:nth-child(11){margin-left:14px}
.prog i::after{content:"";position:absolute;left:0;right:0;bottom:0;height:0;transition:height .35s}
.prog i.now{border-color:var(--teal-d)}.prog i.now::after{height:24%;background:var(--teal)}
.prog i.ok{border-color:var(--ok)}.prog i.ok::after{height:70%;background:var(--ok)}
.prog i.bad{border-color:var(--bad)}.prog i.bad::after{height:70%;background:var(--bad)}
.tube{position:relative;height:32px;border:2px solid var(--ink);border-radius:18px;background:#fff;overflow:hidden;margin:14px 0}
.tube .liq{height:100%;width:100%;background:var(--teal);transition:width .1s linear,background-color .3s}
.tube.warn .liq{background:var(--amber)}.tube.low .liq{background:var(--bad)}
.tube::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(10% - 2px),rgba(65,62,53,.45) calc(10% - 2px),rgba(65,62,53,.45) 10%);-webkit-mask:linear-gradient(#000 0 0) top/100% 45% no-repeat;mask:linear-gradient(#000 0 0) top/100% 45% no-repeat}
.secs{position:absolute;right:10px;top:50%;transform:translateY(-50%);z-index:2;background:#fff;border-radius:12px;padding:0 9px;font-weight:700;font-size:.95rem;font-variant-numeric:tabular-nums;line-height:1.5}
.q{font-size:clamp(1.15rem,3.6vw,1.4rem);line-height:1.3;margin:0 0 16px}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font-size:1rem;background:#fff;border:2px solid var(--line);border-radius:6px;padding:12px 14px;min-height:52px;cursor:pointer}
.opt kbd{flex:none;display:inline-grid;place-items:center;width:26px;height:26px;border-radius:5px;background:var(--tint);color:var(--teal-dd);font:700 .85rem var(--font)}
.opt:hover:not(:disabled){border-color:var(--teal-d);background:var(--tint)}
.opt:disabled{cursor:default}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.opt.gone{display:none}
.tools{display:flex;gap:14px;align-items:center;margin-top:16px;flex-wrap:wrap}
.fb{margin-top:16px;padding:12px 14px;border-radius:6px;border-left:6px solid}
.fb.ok{background:var(--okbg);border-color:var(--ok)}.fb.bad{background:var(--badbg);border-color:var(--bad)}
.fb p{margin:6px 0 0}
.nx{display:block;margin:14px 0 0 auto}
/* results */
.big{font-size:clamp(3rem,12vw,4.6rem);font-weight:800;line-height:1;color:var(--teal-dd);font-variant-numeric:tabular-nums}
.badge{display:inline-block;background:var(--teal-dd);color:#fff;font-weight:700;border-radius:20px;padding:4px 16px;margin:6px 0}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.stats3 div{background:var(--tint);border-radius:6px;padding:10px 12px}
.stats3 b{display:block;font-size:1.3rem}
.stats3 span{font-size:.85rem;color:var(--mut)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
details{margin-top:16px}
summary{cursor:pointer;font-weight:700;color:var(--teal-dd);min-height:32px}
.miss{border-left:4px solid var(--bad);padding:4px 0 4px 12px;margin:10px 0}
.miss p{margin:2px 0}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.25em;flex:none}
.ic.lg{width:34px;height:34px}
.top .tl .ic{color:var(--teal)}
.hero{position:relative}
.hero .art{position:absolute;right:0;top:-4px;width:230px;height:auto}
.hero h1,.hero .lead{position:relative}
.bub{animation:rise 3.6s ease-in infinite;transform-box:fill-box}
.bub.b2{animation-delay:1.2s}.bub.b3{animation-delay:2.3s}
@keyframes rise{0%{transform:translateY(0);opacity:0}25%{opacity:1}100%{transform:translateY(-30px);opacity:0}}
.liquid{height:40px;margin-top:6px;background:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22160%22 height=%2240%22 viewBox=%220 0 160 40%22%3E%3Cpath d=%22M0 20Q20 6 40 20T80 20T120 20T160 20V40H0z%22 fill=%22%2340b0c0%22 fill-opacity=%22.38%22/%3E%3Cpath d=%22M0 28Q20 16 40 28T80 28T120 28T160 28V40H0z%22 fill=%22%231f7f8f%22 fill-opacity=%22.5%22/%3E%3C/svg%3E") repeat-x left bottom/160px 40px}
@media (max-width:760px){
  .hero .art{display:none}
  .grid{grid-template-columns:1fr}
  .logo{height:44px}
  .top .tl .u{display:none}
  .stats3{grid-template-columns:1fr 1fr 1fr;gap:6px}
  .opts.two{grid-template-columns:1fr 1fr}
  .opt kbd{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.bub{animation:none}}
</style>
</head>

<script>
"use strict";
/* ---------- Content ---------- */
const Q=[
{q:"What is yield?",o:["The extra substances formed in a reaction","The amount of useful product obtained from the starting materials","A substance that speeds up a reaction","The temperature of a reaction"],a:1,e:"Yield is the amount of useful product obtained. Byproducts are the extra substances formed."},
{q:"What does a catalyst do?",o:["It is used up to make the product","It slows the reaction down","It speeds up a reaction without being used up","It turns the product into waste"],a:2,e:"Catalysts speed up reactions without being used up, which makes processes more efficient."},
{q:"Which gas makes bread dough rise?",o:["Carbon dioxide","Oxygen","Ammonia","Chlorine"],a:0,e:"Yeast acts as a catalyst that converts sugars into carbon dioxide gas and ethanol."},
{q:"Byproducts are always useful.",o:["True","False"],a:1,fix:1,e:"Some byproducts are useful, but others become waste that must be managed safely."},
{q:"Chemical plants making ammonia for fertilizer are an example of which scale?",o:["Kitchen","Workshop","Industrial","Natural"],a:2,fix:1,e:"Industrial plants make huge quantities of materials such as ammonia, ethylene and sulfuric acid."},
{q:"In traditional ironmaking, what does carbon from charcoal help to do?",o:["Make oxygen leave the iron oxide ore","Colour the iron","Cool the furnace","Add water to the iron"],a:0,e:"Carbon and high temperature cause oxygen to leave the iron oxide ore, leaving pure iron."},
{q:"Which is NOT a reaction condition?",o:["Temperature","Pressure","Mixing","Colour of the container"],a:3,e:"Temperature, pressure, mixing and time affect the products that form."},
{q:"What do decomposers do?",o:["Build wood from carbon dioxide","Break dead material into simple molecules that become nutrients","Make ammonia in factories","Remove oxygen from the air"],a:1,e:"Decomposers recycle dead material into nutrients for the next generation."},
{q:"About what temperature is used in glassmaking?",o:["100°C","500°C","1000°C","1500°C"],a:2,fix:1,e:"Sand, soda ash and lime are heated to about 1000°C to make glass."},
{q:"Composting needs oxygen and microbes.",o:["True","False"],a:0,fix:1,e:"Compost depends on materials, moisture, oxygen, temperature and microorganisms."},
{q:"Soap is made by reacting fats or oils with…",o:["A strong base","Sand","Pure oxygen only","Carbon dioxide"],a:0,e:"Soap forms when fats or oils react with a strong base under controlled conditions."},
{q:"Which chemical is made for water treatment?",o:["Ethylene","Chlorine","Propylene","Ammonia"],a:1,e:"Chlorine is used to treat water. Ethylene and propylene are for plastics."}
];
const S=[["Iron ore",1],["Steel",0],["Heat energy",1],["Finished compost",0],["Sand",1],["Glass",0],["A byproduct",0],["Time (weeks)",1],["Wood logs",1],["Paper",0]];

/* ---------- Difficulty: timers get shorter as the game goes on ---------- */
const LEVELS={
  beginner:{fill:1,name:"Beginner",time:1.5,mult:1,note:"Extra time to think. Score x1"},
  standard:{fill:2,name:"Standard",time:1,mult:1.25,note:"Classroom pace. Score x1.25"},
  expert:{fill:3,name:"Expert",time:.75,mult:1.5,note:"Short timers. Score x1.5"}
};
const ROUNDS={
  1:{title:"Round 1: Quick Quiz",unit:"Question",n:10,pts:100,bon:50,stages:[{n:"Warm-up",from:0,t:20},{n:"Standard",from:3,t:15},{n:"Challenge",from:7,t:10}]},
  2:{title:"Round 2: Input or Output?",unit:"Item",n:8,pts:50,bon:25,stages:[{n:"Warm-up",from:0,t:8},{n:"Speed",from:3,t:6},{n:"Lightning",from:6,t:4}]}
};
const secs=(base,lv)=>Math.max(3,Math.round(base*LEVELS[lv].time));
const stageOf=(r,pos)=>{let s=ROUNDS[r].stages[0];for(const x of ROUNDS[r].stages)if(pos>=x.from)s=x;return s};

/* ---------- Helpers ---------- */
const $=s=>document.querySelector(s);
const app=$("#app");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pkey=(n,g)=>n.toLowerCase().replace(/\s+/g," ")+"|"+g.toLowerCase().replace(/\s+/g," ");
const fmtDate=d=>new Date(d).toLocaleDateString(undefined,{day:"numeric",month:"short"});

/* ---------- Saved data (browser localStorage) ---------- */
const KEY="reemaChemLab.v1";
let canSave=true;
const blank=()=>({last:null,players:{}});
function load(){
  try{
    const r=localStorage.getItem(KEY),d=r?JSON.parse(r):null;
    return d&&typeof d==="object"&&d.players&&typeof d.players==="object"?d:blank();
  }catch(e){canSave=false;return blank()}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){canSave=false}}
let db=load();
if(canSave){try{localStorage.setItem(KEY+".t","1");localStorage.removeItem(KEY+".t")}catch(e){canSave=false}}
function player(n,g,make){
  const k=pkey(n,g);
  if(!db.players[k]&&make)db.players[k]={name:n,grade:g,best:{},history:[]};
  return db.players[k];
}

/* ---------- State ---------- */
let st=null,tm=0,deadline=0;
const ui={name:"",grade:"",level:"standard"};
if(db.last){ui.name=db.last.name||"";ui.grade=db.last.grade||"";if(LEVELS[db.last.level])ui.level=db.last.level}

function stop(){clearInterval(tm);tm=0}

/* ---------- Home ---------- */
function stagesHTML(lv){
  return [1,2].map(r=>{
    const R=ROUNDS[r],L=R.stages,mx=Math.max(...L.map(x=>secs(x.t,lv)));
    const rows=L.map((x,i)=>{
      const to=i+1<L.length?L[i+1].from:R.n,t=secs(x.t,lv);
      return `<span><b>${x.n}</b> <span class="rg">${R.unit}s ${x.from+1}${to-x.from>1?"–"+to:""}</span></span><i style="width:${Math.round(t/mx*100)}%"></i><span class="num"><b>${t}s</b></span>`;
    }).join("");
    return `<div><b>${R.title}</b></div><div class="stg">${rows}</div>`;
  }).join("");
}
function statsHTML(p){
  const lv=Object.keys(LEVELS).map(k=>`<tr><td>${LEVELS[k].name}</td><td class="num">${p.best[k]||"–"}</td></tr>`).join("");
  const hist=p.history.slice(0,5).map(h=>`<tr><td>${fmtDate(h.d)}</td><td>${LEVELS[h.lv]?LEVELS[h.lv].name:""}</td><td class="num">${h.right}/${h.total}</td><td class="num">${h.score}</td></tr>`).join("");
  return `<p style="margin:0 0 8px"><b>${esc(p.name)}</b>${p.grade?" ("+esc(p.grade)+")":""}</p>
  <table class="tbl"><tr><th>Best score</th><th>Points</th></tr>${lv}</table>
  ${hist?`<table class="tbl" style="margin-top:12px"><tr><th>Date</th><th>Level</th><th>Correct</th><th>Score</th></tr>${hist}</table>`:""}
  <button type="button" class="link" data-act="clear" id="clr">Clear saved scores for this student</button>`;
}
function updateStats(){
  const el=$("#stats");if(!el)return;
  const n=$("#nm").value.trim(),g=$("#gr").value.trim(),p=n&&db.players[pkey(n,g)];
  el.innerHTML=p?statsHTML(p):`<p class="mut" style="margin:0">Type your name and class to see your saved scores. Your first score is saved when you finish a game.</p>`;
}
function home(){
  stop();st=null;window.scrollTo(0,0);
  const lvs=Object.keys(LEVELS).map(k=>`<label class="lvopt"><input type="radio" name="lv" value="${k}"${k===ui.level?" checked":""}><span class="lo"><svg class="ic lg" aria-hidden="true"><use href="#i-beaker${LEVELS[k].fill}"/></svg><span><b>${LEVELS[k].name}</b><small>${LEVELS[k].note}</small></span></span></label>`).join("");
  app.innerHTML=`
  <div class="hero"><svg class="art" viewBox="0 0 260 150" aria-hidden="true" focusable="false"><g stroke="#413e35" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M27 70h19v44a9.5 9.5 0 0 1-19 0z" fill="#40b0c0" stroke="none"/><path d="M26 14h22M26 14v100a11 11 0 0 0 22 0V14" transform="translate(0 0)"/><path d="M92.7 92h54.6l9.2 21a7 7 0 0 1-6.4 10H90a7 7 0 0 1-6.4-10z" fill="#8fd3dd" stroke="none"/><path d="M106 14h28M110 14v38L84 112a7 7 0 0 0 6.4 11h59.2a7 7 0 0 0 6.4-11L130 52V14"/><path d="M181.5 62h37v53a6.5 6.5 0 0 1-6.5 6.5h-24a6.5 6.5 0 0 1-6.5-6.5z" fill="#1f7f8f" stroke="none"/><path d="M176 20h48M180 20v95a8 8 0 0 0 8 8h24a8 8 0 0 0 8-8V20"/><path d="M180 45h11M180 70h11M180 95h11" stroke-width="2.2"/><path d="M8 127h244" stroke-width="2.5"/></g><g fill="#fff" stroke="#413e35" stroke-width="1.6"><circle class="bub" cx="37" cy="96" r="3"/><circle class="bub b2" cx="38" cy="82" r="2"/><circle class="bub b3" cx="120" cy="108" r="3.5"/><circle class="bub" cx="132" cy="98" r="2.2"/><circle class="bub b2" cx="200" cy="100" r="3"/><circle class="bub b3" cx="208" cy="84" r="2"/></g></svg><h1>Chemistry Lab Challenge</h1>
  <p class="lead">Test what you know about yield, catalysts, reaction conditions and the scales of making useful materials. Answer quickly for bonus points.</p></div>
  <div class="grid">
    <div>
      <form class="sheet" id="form" autocomplete="off" novalidate>
        <h3><svg class="ic" aria-hidden="true"><use href="#i-flask"/></svg> Start a game</h3>
        <div class="two-in"><div><label class="f" for="nm">Your name</label><input class="inp" id="nm" maxlength="30" value="${esc(ui.name)}"></div>
        <div><label class="f" for="gr">Class</label><input class="inp" id="gr" maxlength="12" placeholder="e.g. 8B" value="${esc(ui.grade)}"></div></div>
        <div class="err" id="err" role="alert"></div>
        <fieldset><legend>Choose your level</legend>${lvs}</fieldset>
        <button class="go" type="submit">Start the challenge</button>
        ${canSave?`<p class="note">Your scores are saved in this browser on this device.</p>`:`<div class="warnbox">This browser is blocking saved data (private mode, perhaps). You can still play, but scores will not be saved.</div>`}
      </form>
      <div class="sheet"><h3><svg class="ic" aria-hidden="true"><use href="#i-tube"/></svg> Your saved scores</h3><div id="stats"></div></div>
    </div>
    <div>
      <div class="sheet"><h3><svg class="ic" aria-hidden="true"><use href="#i-timer"/></svg> How the timer works</h3>
        <p style="margin:0 0 8px;font-size:.92rem">The timer gets shorter as you go. Times for <b id="lvn"></b> level:</p>
        <div id="stages"></div>
        <ul class="rules">
          <li>You answer all 18 questions. A wrong answer or a timeout scores no points and resets your streak.</li>
          <li>Faster answers and streaks earn bonus points.</li>
          <li>One 50/50 lifeline per game on four-choice questions.</li>
          <li>Press 1, 2, 3 or 4 to answer from the keyboard.</li>
        </ul>
      </div>
    </div>
  </div>`;
  updateStats();updateStages();
}
function updateStages(){
  $("#lvn").textContent=LEVELS[ui.level].name;
  $("#stages").innerHTML=stagesHTML(ui.level);
}

/* ---------- Game ---------- */
function start(){
  const a=sh(Q).slice(0,ROUNDS[1].n).map(x=>({r:1,...x,opts:x.o.map((t,i)=>({t,ok:i===x.a}))}));
  const b=sh(S).slice(0,ROUNDS[2].n).map(x=>({r:2,q:`Is “${x[0]}” an input or an output?`,fix:1,opts:[{t:"Input",ok:!!x[1]},{t:"Output",ok:!x[1]}],
    e:`${x[0]} is an ${x[1]?"input (a raw material, energy or time)":"output (a product or byproduct)"}.`}));
  [a,b].forEach(list=>list.forEach((it,pos)=>{
    const R=ROUNDS[it.r],s=stageOf(it.r,pos);
    Object.assign(it,{pos,n:list.length,stage:s.n,t:secs(s.t,ui.level),pts:R.pts,bon:R.bon});
  }));
  st={items:[...a,...b],i:0,score:0,streak:0,maxStreak:0,right:0,fifty:1,res:[],missed:[],screen:"q",done:0,left:0};
  next();
}
function next(){
  if(st.i>=st.items.length)return end();
  const it=st.items[st.i];st.done=0;st.screen="q";
  if(!it.fix)it.opts=sh(it.opts);
  const R=ROUNDS[it.r],two=it.opts.length===2;
  window.scrollTo(0,0);
  app.innerHTML=`
  <div class="hud">
    <div class="rd"><b>${R.title}</b><span>${R.unit} ${it.pos+1} of ${it.n}, ${it.stage} stage</span></div>
    <div class="rt"><span class="sc"><svg class="ic" aria-hidden="true"><use href="#i-flask"/></svg> Score <b class="num" id="sc">${st.score}</b></span></div>
  </div>
  <div class="prog" aria-hidden="true">${st.items.map((x,j)=>`<i class="${j<st.i?(st.res[j]?"ok":"bad"):j===st.i?"now":""}"></i>`).join("")}</div>
  <div class="tube" id="tube" role="timer" aria-label="Time left"><div class="liq" id="tb"></div><span class="secs" id="secs">${it.t}</span></div>
  <section class="sheet">
    <h2 class="q" id="qq">${esc(it.q)}</h2>
    <div class="opts${two?" two":""}" role="group" aria-labelledby="qq">${it.opts.map((o,i)=>`<button type="button" class="opt" data-act="ans" data-i="${i}"><kbd>${i+1}</kbd><span>${esc(o.t)}</span></button>`).join("")}</div>
    <div class="tools"><button type="button" class="ghost" id="f5" data-act="fifty"${st.fifty&&!two?"":" disabled"}><svg class="ic" aria-hidden="true"><use href="#i-half"/></svg> <span id="f5t">${st.fifty?"50/50 (1 left)":"50/50 used"}</span></button><span class="mut"><svg class="ic" aria-hidden="true"><use href="#i-bubbles"/></svg> Streak <b class="num" id="stk">${st.streak}</b></span></div>
    <div id="fb" aria-live="polite"></div>
  </section>`;
  runTimer(it.t);
}
function runTimer(sec){
  stop();deadline=performance.now()+sec*1000;
  const total=st.items[st.i].t;
  const tick=()=>{
    st.left=Math.max(0,(deadline-performance.now())/1000);
    const r=st.left/total,tb=$("#tb");
    if(tb){tb.style.width=(r*100)+"%";$("#secs").textContent=Math.ceil(st.left);
      $("#tube").className="tube"+(r<.25?" low":r<.5?" warn":"")}
    if(st.left<=0)ans(-1);
  };
  tm=setInterval(tick,100);tick();
}
function fifty(){
  if(!st||!st.fifty||st.done)return;
  st.fifty=0;const it=st.items[st.i];let rm=2;
  document.querySelectorAll(".opt").forEach((b,i)=>{if(!it.opts[i].ok&&rm>0){rm--;b.classList.add("gone");b.disabled=true}});
  const f=$("#f5");f.disabled=true;$("#f5t").textContent="50/50 used";
}
function ans(i){
  if(!st||st.done)return;st.done=1;stop();
  const it=st.items[st.i],lv=LEVELS[ui.level],ok=i>=0&&it.opts[i].ok;let msg;
  if(ok){
    st.streak++;st.maxStreak=Math.max(st.maxStreak,st.streak);st.right++;
    const g=Math.round((it.pts+Math.ceil(st.left/it.t*it.bon)+Math.min(st.streak,5)*10)*lv.mult);
    st.score+=g;msg=`Correct! +${g} points`;
  }else{
    st.streak=0;msg=i<0?"Time’s up.":"Not quite.";
    st.missed.push({q:it.q,correct:it.opts.find(o=>o.ok).t,picked:i>=0?it.opts[i].t:null,e:it.e});
  }
  st.res[st.i]=ok;
  document.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;if(it.opts[j].ok)b.classList.add("ok");else if(j===i)b.classList.add("bad")});
  const f5=$("#f5");if(f5)f5.disabled=true;
  $("#sc").textContent=st.score;$("#stk").textContent=st.streak;
  const dots=document.querySelectorAll(".prog i");if(dots[st.i])dots[st.i].className=ok?"ok":"bad";
  const last=st.i+1>=st.items.length;
  $("#fb").innerHTML=`<div class="fb ${ok?"ok":"bad"}"><b><svg class="ic" aria-hidden="true"><use href="#i-${ok?"check":"cross"}"/></svg> ${msg}</b><p>${esc(it.e)}</p></div>
  <button type="button" class="go nx" data-act="next" id="nxt">${last?"See results":"Next question"}</button>`;
  $("#nxt").focus({preventScroll:false});
}
function end(){
  stop();st.screen="end";window.scrollTo(0,0);
  const n=st.items.length,p=st.right/n;
  const rank=p>=.9?"Master Chemist":p>=.7?"Chemist":p>=.5?"Lab Technician":"Lab Assistant";
  const pl=player(ui.name,ui.grade,true),prev=pl.best[ui.level]||0,nb=st.score>prev;
  if(nb)pl.best[ui.level]=st.score;
  pl.history.unshift({d:Date.now(),lv:ui.level,score:st.score,right:st.right,total:n,rank});
  pl.history=pl.history.slice(0,10);
  db.last={name:ui.name,grade:ui.grade,level:ui.level};save();
  const nextLv=ui.level==="beginner"?"standard":ui.level==="standard"?"expert":null;
  const miss=st.missed.map(m=>`<div class="miss"><p><b>${esc(m.q)}</b></p><p>Your answer: ${m.picked?esc(m.picked):"no answer (time ran out)"}</p><p>Correct answer: <b>${esc(m.correct)}</b></p><p class="mut">${esc(m.e)}</p></div>`).join("");
  const hist=pl.history.slice(0,5).map(h=>`<tr><td>${fmtDate(h.d)}</td><td>${LEVELS[h.lv]?LEVELS[h.lv].name:""}</td><td class="num">${h.right}/${h.total}</td><td class="num">${h.score}</td></tr>`).join("");
  app.innerHTML=`<div class="sheet">
    <p class="mut" style="margin:0">Challenge complete, ${esc(ui.name)}</p>
    <div class="big">${st.score}</div><div class="mut">points on ${LEVELS[ui.level].name} level</div>
    <div class="badge"><svg class="ic" aria-hidden="true"><use href="#i-atom"/></svg> ${rank}</div>
    <p style="margin:6px 0 0">${nb?(prev>0?"New personal best for this level.":"First score on the board for this level."):"Your best on this level is "+prev+"."} ${canSave?"Saved on this device.":"Scores can’t be saved in this browser."}</p>
    <div class="stats3"><div><b class="num">${st.right}/${n}</b><span><svg class="ic" aria-hidden="true"><use href="#i-tube"/></svg> Correct</span></div><div><b class="num">${st.maxStreak}</b><span><svg class="ic" aria-hidden="true"><use href="#i-bubbles"/></svg> Best streak</span></div><div><b class="num">${Math.round(p*100)}%</b><span><svg class="ic" aria-hidden="true"><use href="#i-droplet"/></svg> Accuracy</span></div></div>
    <p class="mut">${p<.7?"Review the lesson notes on yield, catalysts, reaction conditions and the four scales, then try again.":"Excellent work. Can you beat your own score?"}</p>
    <div class="row"><button type="button" class="go" data-act="again">Play again</button>
    ${nextLv?`<button type="button" class="ghost" data-act="up" data-lv="${nextLv}">Try ${LEVELS[nextLv].name} level</button>`:""}
    <button type="button" class="ghost" data-act="home">Back to start</button></div>
    ${st.missed.length?`<details${p<.7?" open":""}><summary>Review your mistakes (${st.missed.length})</summary>${miss}</details>`:""}
  </div>
  <div class="sheet"><h3>Recent games</h3><table class="tbl"><tr><th>Date</th><th>Level</th><th>Correct</th><th>Score</th></tr>${hist}</table></div>`;
}

/* ---------- Events ---------- */
let clearArmed=false;
app.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  switch(b.dataset.act){
    case "ans":ans(+b.dataset.i);break;
    case "fifty":fifty();break;
    case "next":st.i++;next();break;
    case "again":start();break;
    case "up":ui.level=b.dataset.lv;start();break;
    case "home":home();break;
    case "clear":{
      const n=$("#nm").value.trim(),g=$("#gr").value.trim();
      if(!clearArmed){clearArmed=true;b.textContent="Tap again to confirm. This cannot be undone.";return}
      clearArmed=false;delete db.players[pkey(n,g)];save();updateStats();break;
    }
  }
});
app.addEventListener("submit",e=>{
  e.preventDefault();
  const n=$("#nm").value.trim().replace(/\s+/g," "),g=$("#gr").value.trim().replace(/\s+/g," ");
  if(!n){$("#err").textContent="Enter your name to start.";$("#nm").focus();return}
  ui.name=n;ui.grade=g;ui.level=(document.querySelector('input[name="lv"]:checked')||{}).value||ui.level;
  db.last={name:n,grade:g,level:ui.level};save();start();
});
app.addEventListener("input",e=>{
  if(e.target.id==="nm"||e.target.id==="gr"){clearArmed=false;$("#err").textContent="";updateStats()}
});
app.addEventListener("change",e=>{
  if(e.target.name==="lv"){ui.level=e.target.value;updateStages()}
});
document.addEventListener("keydown",e=>{
  if(!st||st.screen!=="q"||st.done||e.ctrlKey||e.metaKey||e.altKey||/INPUT|TEXTAREA/.test(e.target.tagName))return;
  const k=+e.key;
  if(k>=1&&k<=9){const b=document.querySelector('.opt[data-i="'+(k-1)+'"]');if(b&&!b.disabled)b.click()}
});

home();
</script>
</body>
</html>
